[package]
name = "git-sync"
version = "0.1.7"
description = "GitSync - 跨平台 Git 自动同步工具"
authors = ["Zephinel"]
edition = "2021"

[lib]
name = "git_sync_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
arboard = { version = "3.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
system-keyring = { package = "keyring", version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
system-keyring = { package = "keyring", version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
system-keyring = { package = "keyring", version = "3", features = ["linux-native"] }
